<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" role="img" aria-labelledby="t d">
  <title id="t">tsql</title>
  <desc id="d">The tsql wordmark above two overlapping circles: TypeScript's world (fetch, window, the DOM…) and PostgreSQL's world (tables, triggers, RLS, indexes…). Where they overlap — immutable, pure business rules — tsql makes both give the same answer.</desc>

