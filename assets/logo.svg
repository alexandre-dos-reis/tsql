<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" role="img" aria-labelledby="t d">
  <title id="t">tsql</title>
  <desc id="d">The tsql wordmark above two overlapping circles: TypeScript's world (fetch, window, the DOM, npm…) and PostgreSQL's world (tables, triggers, RLS policies, indexes…). Where they overlap — pure business rules — tsql makes both give the same answer.</desc>

  <text x="450.0" y="92" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="96" font-weight="800" letter-spacing="-2"><tspan fill="#3178C6">ts</tspan><tspan fill="#4C86BE">ql</tspan></text>

  <circle cx="330" cy="325" r="195" fill="#3178C6" fill-opacity="0.10" stroke="#3178C6" stroke-opacity="0.55" stroke-width="2.5" />
  <circle cx="570" cy="325" r="195" fill="#336791" fill-opacity="0.12" stroke="#336791" stroke-opacity="0.65" stroke-width="2.5" />

  <!-- The overlap, filled: TypeScript's blue fading into PostgreSQL's -->
  <defs>
    <clipPath id="ts-world"><circle cx="330" cy="325" r="195" /></clipPath>
    <linearGradient id="both" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3178C6" />
      <stop offset="1" stop-color="#336791" />
    </linearGradient>
  </defs>
  <circle cx="570" cy="325" r="195" fill="url(#both)" clip-path="url(#ts-world)" />

  <!-- TypeScript's own world -->
  <rect x="172" y="241" width="104" height="104" rx="21" fill="#3178C6" />
  <text x="224" y="312" text-anchor="middle" fill="#FFFFFF" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="47" font-weight="700" letter-spacing="-1.5">TS</text>
  <text x="395" y="480" text-anchor="middle" fill="#7C8BA1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">fetch</text>
  <text x="385" y="175" text-anchor="middle" fill="#7C8BA1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">window</text>
  <text x="225" y="460" text-anchor="middle" fill="#7C8BA1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">DOM</text>
  <text x="345" y="350" text-anchor="middle" fill="#7C8BA1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">npm</text>
