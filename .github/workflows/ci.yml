name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Skip the release path. The "Version Packages" PR, and the commit merging
    # it, only move version numbers and the CHANGELOG — no source changes — and
    # `prepublishOnly` runs the build, the type checker and the whole suite
    # inside `npm publish` anyway, so the release is still gated on green.
    #
    # `github.head_ref` is set on pull_request only, and `head_commit` on push
    # only; each comparison is vacuously true for the other event, so the set
    # covers both without splitting the job. The message is checked two ways
    # because how the PR lands decides what the commit is called: a squash takes
    # the PR title, a merge commit names the branch it came from.
    if: >-
      github.head_ref != 'changeset-release/main' &&
      !startsWith(github.event.head_commit.message, 'chore: version packages') &&
      !contains(github.event.head_commit.message, 'changeset-release/')
    runs-on: ubuntu-latest
    # A real PostgreSQL, so `tsql parity --db-url` and `bun test` is exercised against a server
    # and not only against PGlite.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TSQL_TEST_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5

      # Same Bun as devenv.nix: `bun check` (used by `typecheck`) arrived in 1.4.3.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # tests/cli.test.ts spawns the CLI under `node`, and `engines` asks for >=22.18.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # The published JavaScript: what bin/tsql.mjs and the package's exports load.
      - run: bun run build

      - run: bun run typecheck

      - run: bun test
