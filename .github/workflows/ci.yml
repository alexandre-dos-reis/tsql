name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A real PostgreSQL, so `tsql parity --db-url` and `bun test` is exercised against a server
    # and not only against PGlite.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TSQL_TEST_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      # Same Bun as devenv.nix: `bun check` (used by `typecheck`) arrived in 1.4.3.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # tests/cli.test.ts spawns the CLI under `node`, and `engines` asks for >=22.18.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # The published JavaScript: what bin/tsql.mjs and the package's exports load.
      - run: bun run build

      - run: bun run typecheck

      - run: bun test

  # The examples as a user runs them, installed: their pages build, and the APIs refuse what the
  # compiled function refuses. Every example's tsql scripts are already run by `bun test` above,
  # with nothing installed; this job is what needs Vite, React, PostgREST and PostGraphile.
  examples:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TSQL_TEST_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
    env:
      TSQL_TEST_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      # Same Bun as devenv.nix: `bun check` (used by `typecheck`) arrived in 1.4.3.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # tests/cli.test.ts spawns the CLI under `node`, and `engines` asks for >=22.18.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # The published JavaScript: what bin/tsql.mjs and the package's exports load.
      - run: bun run build

      # Each example's @adr/tsql and typescript become this checkout's, so neither is installed twice.
      - name: Point the examples at this checkout
        run: bun scripts/examples.ts link

      - name: Install and build every example
        run: |
          for example in examples/*/; do
            echo "::group::$example"
            ( cd "$example"
              bun install
              bun run tsql:compile
              if jq -e '.scripts.build' package.json > /dev/null; then bun run build; fi )
            echo "::endgroup::"
          done

      # Then, for the examples with an API, the migration tsql:compile wrote and the schema, into a
      # fresh database each, and the API on it.
      - name: "Example: with-postgrest, the database"
        working-directory: examples/with-postgrest
        run: |
          psql "$TSQL_TEST_DB_URL" -c 'CREATE DATABASE with_postgrest'
          psql postgres://postgres:postgres@localhost:5432/with_postgrest -v ON_ERROR_STOP=1 \
            -f db/01_functions.sql -f db/02_schema.sql

      # PostgREST on that database, as docker-compose.yml runs it. Ada is on the free plan:
      # three todos go in, and the fourth is refused by the compiled function, in the trigger.
      - name: "Example: with-postgrest, through PostgREST"
        run: |
          docker run -d --network host \
            -e PGRST_DB_URI=postgres://authenticator:secret@localhost:5432/with_postgrest \
            -e PGRST_DB_SCHEMAS=api -e PGRST_DB_ANON_ROLE=web_anon \
            postgrest/postgrest:v16.5
          for i in $(seq 30); do curl -sf localhost:3000/users > /dev/null && break; sleep 1; done
          curl -sf localhost:3000/users
          for n in 1 2 3; do
            curl -sf -X POST localhost:3000/todos -H 'Content-Type: application/json' -d "{\"user_id\": 1, \"title\": \"todo $n\"}"
          done
          status=$(curl -s -o refusal.json -w '%{http_code}' -X POST localhost:3000/todos \
            -H 'Content-Type: application/json' -d '{"user_id": 1, "title": "one too many"}')
          cat refusal.json
          test "$status" = 400
          grep -q 'The free plan allows 3 todos' refusal.json

      - name: "Example: with-postgraphile, the database"
        working-directory: examples/with-postgraphile
        run: |
          psql "$TSQL_TEST_DB_URL" -c 'CREATE DATABASE with_postgraphile'
          psql postgres://postgres:postgres@localhost:5432/with_postgraphile -v ON_ERROR_STOP=1 \
            -f db/01_functions.sql -f db/02_schema.sql

      # PostGraphile on that database, through `npm run api` and graphile.config.mjs, then the page's own queries:
      # three todos go in, and the fourth comes back as a GraphQL error from the trigger.
      - name: "Example: with-postgraphile, through PostGraphile"
        working-directory: examples/with-postgraphile
        run: |
          DATABASE_URL=postgres://postgraphile:secret@localhost:5432/with_postgraphile \
            nohup bun run api > postgraphile.log 2>&1 &
          gql() { curl -s localhost:5678/graphql -H 'Content-Type: application/json' -d "$1"; }
          for i in $(seq 60); do gql '{"query":"{ __typename }"}' | grep -q Query && break; sleep 1; done
          fail() {
            report=$(printf '%s\n\n%s\n\n%s' "$1" "$(cat postgraphile.log)" \
              "$(gql '{"query":"{ __type(name: \"Query\") { fields { name } } t: __type(name: \"Todo\") { fields { name } } u: __type(name: \"User\") { fields { name } } }"}')")
            report=${report//'%'/'%25'}; report=${report//$'\n'/'%0A'}
            echo "::error title=PostGraphile example::${report}"; exit 1
          }
          users=$(gql '{"query":"{ allUsers(orderBy: ROW_ID_ASC) { nodes { id: rowId name plan } } }"}')
          echo "$users"
          echo "$users" | grep -q '"name":"Ada"' || fail "allUsers: $users"
          for n in 1 2 3; do
            created=$(gql "{\"query\":\"mutation (\$todo: TodoInput!) { createTodo(input: { todo: \$todo }) { todo { rowId } } }\",\"variables\":{\"todo\":{\"userId\":1,\"title\":\"todo $n\"}}}")
            echo "$created"
            echo "$created" | grep -q '"errors"' && fail "createTodo $n: $created"
          done
          refused=$(gql '{"query":"mutation ($todo: TodoInput!) { createTodo(input: { todo: $todo }) { todo { rowId } } }","variables":{"todo":{"userId":1,"title":"one too many"}}}')
          echo "$refused"
          echo "$refused" | grep -q 'The free plan allows 3 todos' || fail "the fourth todo: $refused"
          todos=$(gql '{"query":"{ allTodos(condition: { userId: 1 }, orderBy: ROW_ID_ASC) { nodes { id: rowId title } } }"}')
          echo "$todos"
          test "$(echo "$todos" | grep -o '"title"' | wc -l)" = 3 || fail "allTodos: $todos"
