name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A real PostgreSQL, so `tsql parity --db-url` and `bun test` is exercised against a server
    # and not only against PGlite.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TSQL_TEST_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      # Same Bun as devenv.nix: `bun check` (used by `typecheck`) arrived in 1.4.3.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # tests/cli.test.ts spawns the CLI under `node`, and `engines` asks for >=22.18.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # The published JavaScript: what bin/tsql.mjs and the package's exports load.
      - run: bun run build

      - run: bun run typecheck

      - run: bun test
