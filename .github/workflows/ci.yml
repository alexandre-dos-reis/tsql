name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A real PostgreSQL, so `tsql parity --db-url` and `bun test` is exercised against a server
    # and not only against PGlite.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TSQL_TEST_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      # Same Bun as devenv.nix: `bun check` (used by `typecheck`) arrived in 1.4.3.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # tests/cli.test.ts spawns the CLI under `node`, and `engines` asks for >=22.18.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # The published JavaScript: what bin/tsql.mjs and the package's exports load.
      - run: bun run build

      - run: bun run typecheck

      - run: bun test

      # The command users run, end to end on every example, 200 inputs per
      # function: once on the default in-process PGlite, once on the real
      # PostgreSQL service through --db-url.
      - name: tsql parity (PGlite)
        run: bun run ex:parity

      - name: tsql parity (PostgreSQL 18)
        run: bun run ex:parity --db-url="$TSQL_TEST_DB_URL"

      # The README's "Using the functions from SQL" patterns, run for real: the generated migration, then
      # examples/usage.sql, whose assertions raise if a CHECK, a generated column or a trigger does
      # not behave as documented.
      - name: Functions used from SQL (PostgreSQL 18)
        run: psql "$TSQL_TEST_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f examples/output.sql -f examples/usage.sql

      # The compiler owns examples/output.sql and tsql-manifest.json and guarantees
      # byte-identical re-runs, so a stale committed copy is a build failure.
      - name: Generated examples are up to date
        run: bun run ex:compile

      - name: Upload generated examples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examples
          path: |
            examples/output.sql
            examples/tsql-manifest.json

      # On drift, the diff is also posted as an annotation, so it can be read
      # (and applied with `git apply`) from the PR without downloading anything.
      - name: Fail if generated examples drifted
        run: |
          if ! git diff --quiet -- examples/output.sql examples/tsql-manifest.json; then
            diff=$(git diff -- examples/output.sql examples/tsql-manifest.json)
            diff=${diff//'%'/'%25'}
            diff=${diff//$'\r'/'%0D'}
            diff=${diff//$'\n'/'%0A'}
            echo "::error title=Generated examples are stale — run bun run ex:compile::${diff}"
            exit 1
          fi
