name: CI

on:
  # Prose and repository furniture are skipped: nothing in them can change what
  # the compiler emits or whether it builds. Written as what to *skip* rather
  # than what to run, so a directory added later is tested by default — an
  # allowlist would silently stop covering it. Everything else still triggers,
  # including package.json, bun.lock and tsconfig.json, which decide what the
  # build and the packaging tests see. GitHub does not expand YAML anchors, so
  # the list is repeated per event.
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md" # README, CLAUDE, CONTRIBUTING, CHANGELOG, docs/, tests/README
      - "docs/**"
      - "assets/**"
      - "LICENSE"
      - ".changeset/**" # release metadata; the Release workflow reads it, not this one
      - ".githooks/**" # local gates, never run here
      - ".envrc"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**/*.md" # README, CLAUDE, CONTRIBUTING, CHANGELOG, docs/, tests/README
      - "docs/**"
      - "assets/**"
      - "LICENSE"
      - ".changeset/**" # release metadata; the Release workflow reads it, not this one
      - ".githooks/**" # local gates, never run here
      - ".envrc"
      - ".gitignore"

# One run per branch at a time. A push supersedes whatever was testing the
# branch before it, and that older run can only answer a question nobody is
# asking any more — a thirteen-commit branch started thirteen full suites and
# twelve of them were obsolete before they finished.
#
# `head_ref` on a pull request, `ref` on a push, so a PR and its eventual merge
# commit are grouped separately: the merge result is a tree neither the branch
# nor main was tested as, and is worth its own run.
#
# The release workflow deliberately does the opposite (`cancel-in-progress:
# false`): cancelling a publish half-way could leave npm and the git tags
# disagreeing. Cancelling a test run costs nothing.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Skip the release path. The "Version Packages" PR, and the commit merging
    # it, only move version numbers and the CHANGELOG — no source changes — and
    # `prepublishOnly` runs the build, the type checker and the whole suite
    # inside `npm publish` anyway, so the release is still gated on green.
    #
    # `github.head_ref` is set on pull_request only, and `head_commit` on push
    # only; each comparison is vacuously true for the other event, so the set
    # covers both without splitting the job. The message is checked two ways
    # because how the PR lands decides what the commit is called: a squash takes
    # the PR title, a merge commit names the branch it came from.
    if: >-
      github.head_ref != 'changeset-release/main' &&
      !startsWith(github.event.head_commit.message, 'chore: version packages') &&
      !contains(github.event.head_commit.message, 'changeset-release/')
    runs-on: ubuntu-latest
    # A real PostgreSQL, so `tsql parity --db-url` and `bun test` is exercised against a server
    # and not only against PGlite.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TSQL_TEST_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5

      # Same Bun as devenv.nix: `bun check` (used by `typecheck`) arrived in 1.4.3.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # tests/cli.test.ts spawns the CLI under `node`, and `engines` asks for >=22.18.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # The published JavaScript: what bin/tsql.mjs and the package's exports load.
      - run: bun run build

      - run: bun run typecheck

      - run: bun test
