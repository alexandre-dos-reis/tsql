name: Release

# Triggered automatically ONLY after the CI workflow completes successfully on main.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # CRITICAL: Ensure we only proceed if CI actually succeeded,
    # and ignore if CI was cancelled or failed.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Note: workflow_run checks out the default branch (main) head by default,
          # which is correct for changesets publishing.

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - uses: changesets/action@v2
        with:
          version-script: bun run version
          publish-script: bun run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: true
