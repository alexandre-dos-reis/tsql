name: Release

# Triggered automatically ONLY after the CI workflow completes successfully on main.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Proceed when CI succeeded, or when it was skipped *on purpose*: ci.yml skips
    # the commit that merges the "Version Packages" PR (nothing in it can change
    # what the compiler emits), and that is exactly the commit that has to
    # publish. Requiring `success` alone made the two skips cancel out, so a
    # version bump was merged and never released. A failed or cancelled CI, or a
    # skipped one on any other commit, still stops here. The message is checked
    # two ways for the reason ci.yml gives: a squash takes the PR title, a merge
    # commit names the branch.
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      (github.event.workflow_run.conclusion == 'skipped' &&
      (startsWith(github.event.workflow_run.head_commit.message, 'chore: version packages') ||
      contains(github.event.workflow_run.head_commit.message, 'changeset-release/')))

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Note: workflow_run checks out the default branch (main) head by default,
          # which is correct for changesets publishing.

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - uses: changesets/action@v2
        with:
          version-script: bun run version
          publish-script: bun run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: true
